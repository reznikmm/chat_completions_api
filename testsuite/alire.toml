name = "testsuite"
description = "Unit test suite for Chat_Completions_API"
version = "0.1.0-dev"

authors = ["Max Reznik"]
maintainers = ["Max Reznik <reznikmm@gmail.com>"]
maintainers-logins = ["reznikmm"]
licenses = "Apache-2.0 WITH LLVM-exception"
website = ""
tags = []

executables = ["testsuite"]

[build-switches]
"*".Ada_Version = "Ada2022"
development.optimization = ["-O0"]
development.style_checks = ["-gnaty", "-gnaty-B"]
development.contracts = "Yes"
"*".debug_info = "Yes"

[build-profiles]
"chat_completions_api" = "development"

[[depends-on]]
trendy_test = "^0"
chat_completions_api = "*"

[[pins]]
chat_completions_api = { path = ".." }
